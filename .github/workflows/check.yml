name: Check publication

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    env:
      # Review dates use the authoring timezone, including around UTC midnight.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check simplified Chinese reading files
        run: python tools/studio.py --root . build --check
      - name: Check source and publication evidence
        run: python tools/studio.py --root . --json check --publication --language zh-CN
