composition: 手绘 PowerShell 局部。第一行精确写 PS C:\练习> pwd；下面空一行，再画三行输出 Path、----、C:\练习。盘符与路径的箭头只指第一行
  C:\练习；输入命令的箭头只指第一行末尾 pwd；查看输出的箭头只指下面单独的输出区域。不要把箭头指向窗口标题。不要画命令表。
