schema_version: 1
title: 一次请求的数据去哪
reader_question: 如何理解“一次请求的数据去哪”？
takeaway: 发送的是本次请求所需材料；具体处理与保存条件按所用服务核对。
source_sections:
- 11.1 先看一张图：一次对话的数据去了哪
placement: 11.1 先看一张图：一次对话的数据去了哪
composition: 画面严格左右两区：左侧标“本地”，含本地文件柜、挑出的少量“本次请求材料”以及一个显示“返回结果”的窗口；右侧标“远端”，只有“所连接服务商”服务器。上方出站箭头必须从左侧请求材料指向右侧服务器；下方返回箭头必须从右侧服务器指回左侧的返回结果窗口。返回结果窗口和文字绝不能归在远端一侧。不要将整个文件柜画入传输箭头。
content_guard: '不画整盘必上传；保存、训练和传输三个概念分开。

  Only a selected SMALL subset of file sheets enters the outgoing request, never the
  entire file cabinet. Neutral arrows no padlock guarantees.'
