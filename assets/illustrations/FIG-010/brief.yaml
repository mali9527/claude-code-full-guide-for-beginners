schema_version: 1
title: 人和助手的一次协作循环
reader_question: 如何理解“人和助手的一次协作循环”？
takeaway: 七步法是一种工作习惯；实际界面不保证每轮出现七次确认。
source_sections:
- 8.2 七步走一遍完整流程
placement: 8.2 七步走一遍完整流程
composition: 严格两条横向泳道。上排标“你”，由左至右四个节点：描述、审核、决定、验证。下排标“助手”，由左至右三个节点：分析、提案、执行。描述与分析在左侧上下相对；审核与提案在中间上下相对；决定与执行在偏右上下相对；验证在最右上排。只画下面七条有方向的连接，形成一条连续的跨泳道循环：描述↓分析，分析→提案，提案↑审核，审核→决定，决定↓执行，执行↑验证，验证沿最上方长弧线返回描述。
content_guard: 'EXACT directed edges: 描述 -> 分析 -> 提案 -> 审核 -> 决定 -> 执行 -> 验证 -> 描述.
  The human lane contains 描述,审核,决定,验证; the assistant lane contains 分析,提案,执行. No edge
  from 描述 directly to 审核, no edge from 提案 directly to 执行. 验证 MUST be in the human
  lane. These constraints are NOT text to print. Only title and required labels. No
  footer, note or disclaimer.'
